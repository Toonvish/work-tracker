[package]
name = "work-tracker"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"           # the real toolchain; clippy MSRV lints then match what is used

[[bin]]
name = "work-tracker"
path = "src/main.rs"

[dependencies]
anyhow     = "1.0.104"
chrono     = { version = "0.4.45", features = ["serde"] }
clap       = { version = "4.6.7", features = ["derive"] }
console    = "0.16.6"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
open       = "5.4.4"
ratatui    = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
regex      = "1.13.1"
reqwest    = { version = "0.13.5", features = ["blocking", "json", "query"] }
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror  = "2.0.21"
toml       = "1.1.6"
tui-markdown = { version = "0.3.13", default-features = false }

[dev-dependencies]
chrono-tz = "0.10.4"
tempfile  = "3.27.0"
